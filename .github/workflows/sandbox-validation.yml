# Install this file as .github/workflows/sandbox-validation.yml on the dedicated
# sandbox repository's default branch. No project install/build is needed here.
name: Sandbox exact-candidate validation
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        required: true
        type: string
      pull_request_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      expected_base_sha:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      contract_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check dispatched candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONTRACT_VERSION: ${{ inputs.contract_version }}
        run: |
          test "$CONTRACT_VERSION" = 1
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -d .sandbox
